server:
  port: 8080

  application:
    name: course-server


spring:
  datasource:
    url: jdbc:mysql://localhost:3306/course_db?useSSL=false&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
    username: root
    password: admin
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        show_sql: true
        format_sql: false
    hibernate:
      ddl-auto: update






